# Compila la version del Osborne 1 para la Chameleon96 (revision Osborne_ch96)
# con Quartus 17.0 (imagen Docker raetro/quartus:17.0).
#
# - push a main / pull request: compila y sube el resultado (pestana Actions).
#   En los push a main guarda ademas el RBF en releases/ como
#   Osborne_AAAAMMDD_ch96.rbf, que es donde lo busca el actualizador.
# - Lanzar a mano: Actions > Build ch96 > Run workflow. Tambien lo lanza
#   sync.yml despues de sincronizar con shaeon/Osborne_MiSTer.
# - Release: git tag v1.0 && git push origin v1.0
#
# Solo se ejecuta en shaeon/Osborne_MiSTer_ch96. El build.yml que viene del
# repositorio principal no hace nada aqui.
#
# Node.js: acciones con Node 24 (checkout@v6, upload-artifact@v6,
# action-gh-release@v3) y FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 para el resto.

name: Build ch96

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'releases/**'
      - 'docs/**'
      - 'sim/**'
      - 'tools/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'releases/**'
      - 'docs/**'
      - 'sim/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write          # Release en las etiquetas v* y RBF en releases/

concurrency:
  group: build-ch96-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REV: Osborne_ch96

jobs:
  build:
    if: github.repository == 'shaeon/Osborne_MiSTer_ch96'
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      # La imagen de Quartus ocupa unos 6 GB comprimida: se libera sitio en la
      # maquina de GitHub antes de descargarla.
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Descargar Quartus 17.0
        run: docker pull raetro/quartus:17.0

      - name: Compilar
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/build -w /build raetro/quartus:17.0 \
            quartus_sh --flow compile "$REV"

      - name: Errores de Quartus
        if: failure()
        run: |
          ERR=$(cat output_files/$REV.*.rpt 2>/dev/null | grep -E '^(Error|Critical Warning) \(' | sort -u | head -40)
          {
            echo "## Errores de Quartus"
            echo '```'
            echo "${ERR:-No hay informes: mira el log del paso Compilar}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$ERR" | grep '^Error' | head -10 | while read -r l; do echo "::error title=Quartus::$l"; done

      - name: Resumen de tiempos
        if: always()
        run: |
          STA=output_files/$REV.sta.rpt
          [ -f "$STA" ] || { echo "No hay informe de tiempos" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo "## $REV - tiempos (modelo lento)"
            echo '```'
            for s in "Setup Summary" "Hold Summary" "Recovery Summary" "Removal Summary"; do
              echo "== $s"
              sed -n "/; $s/,/^$/p" "$STA" | grep '^; [^C-]' | grep -v 'Clock *;' | cut -c1-110
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if sed -n '/Setup Summary/,/Removal Summary/p' "$STA" | grep -qE ';[[:space:]]*-[0-9]+\.[0-9]+[[:space:]]*;'; then
            echo "::warning title=Tiempos::Hay holguras negativas: revisa $REV.sta.rpt"
          fi

      - name: Preparar el resultado
        if: always()
        run: |
          mkdir -p dist
          DATE=$(date -u +%Y%m%d)
          [ -f output_files/$REV.rbf ] && cp output_files/$REV.rbf "dist/Osborne_${DATE}_ch96.rbf"
          for r in map fit sta flow asm; do
            [ -f output_files/$REV.$r.rpt ] && cp output_files/$REV.$r.rpt dist/
          done
          ls -la dist

      - name: Subir el resultado
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.REV }}-${{ github.sha }}
          path: dist/
          retention-days: 30

      # Solo en main (push o lanzado a mano/por sync.yml), no en pull requests
      # ni etiquetas. El commit lo hace GITHUB_TOKEN, que no vuelve a lanzar
      # workflows, y releases/ esta en paths-ignore.
      - name: Guardar el RBF en releases/
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "Shaeon (Carlos Palmero)"
          git config user.email "shaeon@users.noreply.github.com"
          git pull --rebase --quiet origin main
          mkdir -p releases
          cp dist/Osborne_*_ch96.rbf releases/
          git add releases/
          if git diff --cached --quiet; then echo "El RBF no ha cambiado"; exit 0; fi
          git commit -q -m "releases: $(ls dist/Osborne_*_ch96.rbf | xargs -n1 basename)"
          git push origin HEAD:main

      - name: Crear la Release (etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Osborne_*_ch96.rbf
          generate_release_notes: true
