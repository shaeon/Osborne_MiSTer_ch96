# Mantiene este repositorio al dia con shaeon/Osborne_MiSTer (rama main).
#
# Cada noche (o a mano: Actions > Sync > Run workflow):
#   1. Trae upstream/main y lo mezcla con main.
#   2. Los conflictos en releases/ se resuelven solos quitando el fichero.
#      Cualquier otro conflicto (por ejemplo en sys/ si cambia el framework
#      de MiSTer) para el workflow y se avisa en el resumen: hay que
#      resolverlo a mano.
#   3. Quita de releases/ todo RBF que no termine en _ch96.rbf (los de la
#      DE10-Nano no deben llegar al actualizador de la Chameleon96).
#   4. Sube el resultado y lanza build_ch96.yml.
#
# Un push hecho con GITHUB_TOKEN no lanza otros workflows; por eso se lanza
# la compilacion con "gh workflow run" (workflow_dispatch si funciona).

name: Sync

on:
  schedule:
    - cron: '23 3 * * *'      # 03:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UPSTREAM: https://github.com/shaeon/Osborne_MiSTer.git

jobs:
  sync:
    if: github.repository == 'shaeon/Osborne_MiSTer_ch96'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Mezclar con shaeon/Osborne_MiSTer
        id: sync
        run: |
          git config user.name "Shaeon (Carlos Palmero)"
          git config user.email "shaeon@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch --quiet upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Ya esta al dia con $(git rev-parse --short upstream/main)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --no-ff --no-commit upstream/main || true

          # conflictos en releases/: fuera
          # (los run de GitHub van con bash -eo pipefail: grep sin coincidencias no debe parar)
          git diff --name-only --diff-filter=U | { grep '^releases/' || true; } | while read -r f; do
            git rm -q -f -- "$f"
          done

          LEFT=$(git diff --name-only --diff-filter=U)
          if [ -n "$LEFT" ]; then
            {
              echo "## Conflictos al sincronizar con upstream/main"
              echo "Hay que resolverlos a mano:"
              echo '```'
              echo "$LEFT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$LEFT" | while read -r f; do echo "::error title=Conflicto::$f"; done
            exit 1
          fi

          # solo RBF de la Chameleon96 en releases/
          for f in releases/*.rbf; do
            [ -e "$f" ] || continue
            case "$f" in
              *_ch96.rbf) ;;
              *) git rm -q -f -- "$f" ;;
            esac
          done

          git commit -q -m "Sincronizar con shaeon/Osborne_MiSTer ($(git rev-parse --short upstream/main))"
          git push origin HEAD:main
          {
            echo "## Sincronizado con upstream/main $(git rev-parse --short upstream/main)"
            echo '```'
            git log --oneline HEAD^1..HEAD^2 | head -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Lanzar la compilacion
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build_ch96.yml --ref main
